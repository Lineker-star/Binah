<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- subtle network/constellation field -->
  <g stroke="#6366F1" stroke-width="1" opacity="0.35">
    <line x1="60" y1="80" x2="150" y2="140"/>
    <line x1="150" y1="140" x2="90" y2="220"/>
    <line x1="1080" y1="70" x2="1140" y2="150"/>
    <line x1="1140" y1="150" x2="1060" y2="210"/>
    <line x1="980" y1="300" x2="1080" y2="340"/>
    <line x1="120" y1="320" x2="200" y2="290"/>
  </g>
  <g fill="#818CF8" opacity="0.6">
    <circle cx="60" cy="80" r="3"/>
    <circle cx="150" cy="140" r="4"/>
    <circle cx="90" cy="220" r="3"/>
    <circle cx="1080" cy="70" r="3"/>
    <circle cx="1140" cy="150" r="4"/>
    <circle cx="1060" cy="210" r="3"/>
    <circle cx="980" cy="300" r="3"/>
    <circle cx="1080" cy="340" r="4"/>
    <circle cx="120" cy="320" r="3"/>
    <circle cx="200" cy="290" r="3"/>
  </g>

  <!-- Cameroon-inspired accent: a tasteful tri-tone underline, not the literal flag -->
  <g transform="translate(500,345)">
    <rect x="0" y="0" width="66" height="5" rx="2.5" fill="#1D9E75"/>
    <rect x="72" y="0" width="66" height="5" rx="2.5" fill="#EF9F27"/>
    <rect x="144" y="0" width="66" height="5" rx="2.5" fill="#D85A30"/>
  </g>

  <!-- Binah mark: open book + rising network, larger, centered-left -->
  <g transform="translate(150,90) scale(1.35)">
    <path d="M100,150 C70,155 38,148 18,122 C15,100 19,74 36,58 C58,70 82,88 100,96 Z" fill="url(#bookGrad)"/>
    <path d="M100,150 C130,155 162,148 182,122 C185,100 181,74 164,58 C142,70 118,88 100,96 Z" fill="url(#bookGrad)"/>
    <path d="M100,96 L100,152" stroke="#1E1B4B" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <g stroke="#C7D2FE" stroke-width="2.5" stroke-linecap="round">
      <line x1="100" y1="96" x2="100" y2="66"/>
      <line x1="100" y1="66" x2="76" y2="52"/>
      <line x1="100" y1="66" x2="124" y2="52"/>
      <line x1="76" y1="52" x2="100" y2="38"/>
      <line x1="124" y1="52" x2="100" y2="38"/>
      <line x1="76" y1="52" x2="60" y2="76"/>
      <line x1="124" y1="52" x2="140" y2="76"/>
      <line x1="60" y1="76" x2="100" y2="96"/>
      <line x1="140" y1="76" x2="100" y2="96"/>
    </g>
    <g fill="#C7D2FE">
      <circle cx="100" cy="38" r="7"/>
      <circle cx="76" cy="52" r="6"/>
      <circle cx="124" cy="52" r="6"/>
      <circle cx="60" cy="76" r="5.5"/>
      <circle cx="140" cy="76" r="5.5"/>
      <circle cx="100" cy="66" r="6.5"/>
    </g>
    <circle cx="100" cy="38" r="7" fill="#EEF2FF"/>
  </g>

  <text x="500" y="180" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" font-size="76" fill="#FFFFFF">BINAH</text>
  <text x="500" y="228" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" font-size="30" fill="#A5B4FC">The Intelligent Classroom</text>
  <text x="500" y="270" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#C7D2FE">Built in Bertoua, Cameroon — AI-taught courses, quizzes,</text>
  <text x="500" y="296" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#C7D2FE">certificates, and full-length textbooks turned into lessons.</text>
</svg>
